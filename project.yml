# xcodegen spec. Regenerate after adding or removing any file:  xcodegen generate
name: AutoGrade
options:
  bundleIdPrefix: dev.chenshaojie.autograde
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # The pre-build phase writes the metallib straight into the product.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  AutoGradeCore:
    type: framework
    platform: macOS
    sources:
      - path: Core
        excludes: ["Shaders/**"]
      # listed for the navigator only; Tools/build-metallib.sh compiles them
      - path: Core/Shaders
        buildPhase: none
      # compiled by Xcode into AdaIntFiveK.mlmodelc inside the framework
      - path: Resources/Models/AdaIntFiveK.mlpackage
        buildPhase: sources
      - path: Resources/Models/AdaInt-LICENSE.txt
        buildPhase: resources
      # subtitles and cover titles (CLAUDE.md 字幕 / 许可与素材): registered for this process only
      - path: Resources/Fonts/SourceHanSansCN-Bold.otf
        buildPhase: resources
      - path: licenses/SourceHanSans-LICENSE.txt
        buildPhase: resources
    preBuildScripts:
      - name: Build metallib (safe math)
        script: '"$SRCROOT/Tools/build-metallib.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AutoGrade.metallib"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenshaojie.autograde.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        INSTALL_PATH: "@rpath"
    scheme:
      testTargets: [AutoGradeCoreTests]
  AutoGradeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: AutoGradeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenshaojie.autograde.tests
        GENERATE_INFOPLIST_FILE: YES
  AutoGrade:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    dependencies:
      - target: AutoGradeCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenshaojie.autograde.app
        PRODUCT_NAME: AutoGrade
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist   # merged: document types only
        INFOPLIST_KEY_CFBundleDisplayName: AutoGrade
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
    scheme: {}
  AutoGradeAppTests:
    type: bundle.unit-test
    platform: macOS
    # compiles the language files directly: no app host needed
    sources: [App/Localization, AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenshaojie.autograde.apptests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: [AutoGradeAppTests]
  autograde:
    type: tool
    platform: macOS
    sources: [CLI]
    dependencies:
      - target: AutoGradeCore
        embed: false
    settings:
      base:
        PRODUCT_NAME: autograde
        # the framework sits beside the executable in the build products
        LD_RUNPATH_SEARCH_PATHS: "@executable_path"
    scheme: {}
